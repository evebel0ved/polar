<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofort Instant Camera</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="viewport">
    <header class="navbar">
      <div class="navbar-content">
        <div class="logo-group">
          <h1>sofort</h1>
          <span class="tagline">instant memories</span>
        </div>
        <nav class="nav-links">
          <a href="#" class="nav-item active">Camera</a>
          <a href="#" class="nav-item">Export</a>
        </nav>
      </div>
    </header>

    <main class="workspace">
      <section class="canvas-panel">
        <div class="canvas-wrapper">
          <canvas id="mainCanvas" width="1200" height="900"></canvas>
        </div>
      </section>

      <aside class="control-panel">
        <div class="panel-header">
          <h2>Settings</h2>
          <p class="subtitle">Customize your shot</p>
        </div>

        <div class="control-group">
          <label class="control-label">Upload Photo</label>
          <div class="file-control">
            <input type="file" id="photoInput" accept="image/*" class="file-input">
            <button class="file-button" onclick="document.getElementById('photoInput').click()">
              <span class="icon">+</span>
              <span>Choose Image</span>
            </button>
            <p class="file-info" id="photoInfo">No image selected</p>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Camera Body</label>
          <div class="color-palette">
            <button class="color-swatch active" data-color="white" style="background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);" title="Pearl White"></button>
            <button class="color-swatch" data-color="champagne" style="background: linear-gradient(135deg, #f5f0e8 0%, #ede5dd 100%);" title="Champagne"></button>
            <button class="color-swatch" data-color="pastel-blue" style="background: linear-gradient(135deg, #e8f4ff 0%, #d8e8f7 100%);" title="Sky Blue"></button>
            <button class="color-swatch" data-color="pastel-pink" style="background: linear-gradient(135deg, #ffe8f0 0%, #f5dce5 100%);" title="Rose"></button>
            <button class="color-swatch" data-color="pastel-green" style="background: linear-gradient(135deg, #e8ffe8 0%, #d8f5d8 100%);" title="Mint"></button>
            <button class="color-swatch" data-color="black" style="background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);" title="Midnight"></button>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Position & Scale</label>
          <div class="slider-group">
            <div class="slider-item">
              <label>Horizontal</label>
              <input type="range" id="posX" min="-100" max="100" value="0" class="slider">
              <span class="value" id="posXVal">0</span>
            </div>
            <div class="slider-item">
              <label>Vertical</label>
              <input type="range" id="posY" min="-100" max="100" value="0" class="slider">
              <span class="value" id="posYVal">0</span>
            </div>
            <div class="slider-item">
              <label>Zoom</label>
              <input type="range" id="scale" min="50" max="200" value="100" class="slider">
              <span class="value" id="scaleVal">100%</span>
            </div>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Background</label>
          <div class="bg-options">
            <label class="bg-option">
              <input type="radio" name="bg" value="light" checked>
              <span>Soft Light</span>
            </label>
            <label class="bg-option">
              <input type="radio" name="bg" value="neutral">
              <span>Neutral</span>
            </label>
            <label class="bg-option">
              <input type="radio" name="bg" value="warm">
              <span>Warm</span>
            </label>
          </div>
        </div>

        <div class="control-group">
          <label class="control-label">Animation</label>
          <label class="checkbox-control">
            <input type="checkbox" id="animToggle">
            <span>Enable slide effect</span>
          </label>
          <div class="slider-group mt-8">
            <div class="slider-item">
              <label>Duration</label>
              <input type="range" id="gifDuration" min="1" max="5" step="0.5" value="3" class="slider">
              <span class="value" id="durationVal">3s</span>
            </div>
          </div>
        </div>

        <div class="control-group">
          <div class="action-buttons">
            <button class="btn btn-primary" id="downloadPng">Export PNG</button>
            <button class="btn btn-secondary" id="downloadGif">Export GIF</button>
            <button class="btn btn-tertiary" id="resetBtn">Reset</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <script src="./engine.js"></script>
</body>
</html>
