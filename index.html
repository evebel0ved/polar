<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Polaroid Maker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="logo">Instant Polaroid</h1>
      <p class="subtitle">카메라로 순간을 담아보세요</p>
    </header>

    <main class="main-content">
      <section class="preview-section">
        <div class="camera-frame">
          <canvas id="cameraCanvas" width="800" height="960"></canvas>
        </div>
      </section>

      <section class="controls-section">
        <div class="control-group">
          <h3 class="group-title">📸 사진</h3>
          <div class="file-input-wrapper">
            <input type="file" id="imageInput" accept="image/*" class="file-input">
            <button class="btn btn-primary" onclick="document.getElementById('imageInput').click()">
              사진 선택
            </button>
            <span id="fileName" class="file-name">선택된 파일 없음</span>
          </div>
          <button class="btn btn-secondary" id="clearBtn">사진 제거</button>
        </div>

        <div class="control-group">
          <h3 class="group-title">🎨 카메라 색상</h3>
          <div class="color-grid">
            <button class="color-option" data-color="#f5f5f5" style="background: #f5f5f5; border: 3px solid #ddd;" title="화이트"></button>
            <button class="color-option" data-color="#fff5f7" style="background: #fff5f7; border: 3px solid #ffe6ef;"></button>
            <button class="color-option" data-color="#f5f8ff" style="background: #f5f8ff; border: 3px solid #e6f2ff;"></button>
            <button class="color-option" data-color="#fffbf0" style="background: #fffbf0; border: 3px solid #ffe8cc;"></button>
            <button class="color-option" data-color="#f0fff5" style="background: #f0fff5; border: 3px solid #ccffe6;"></button>
            <button class="color-option" data-color="#f5f0ff" style="background: #f5f0ff; border: 3px solid #e6d9ff;"></button>
          </div>
        </div>

        <div class="control-group">
          <h3 class="group-title">📍 사진 위치</h3>
          <label class="slider-label">
            가로 위치
            <input type="range" id="imageX" min="0" max="100" step="5" value="50" class="slider">
            <span class="slider-value" id="imageXValue">50</span>
          </label>
          <label class="slider-label">
            세로 위치
            <input type="range" id="imageY" min="0" max="100" step="5" value="50" class="slider">
            <span class="slider-value" id="imageYValue">50</span>
          </label>
          <label class="slider-label">
            크기
            <input type="range" id="imageScale" min="50" max="150" step="10" value="100" class="slider">
            <span class="slider-value" id="imageScaleValue">100%</span>
          </label>
        </div>

        <div class="control-group">
          <h3 class="group-title">✨ 배경</h3>
          <label class="color-input-label">
            배경색
            <input type="color" id="bgColor" value="#e8e8e8" class="color-input">
          </label>
        </div>

        <div class="control-group">
          <h3 class="group-title">🎬 애니메이션</h3>
          <label class="checkbox-label">
            <input type="checkbox" id="animationToggle">
            슬라이드 애니메이션 활성화
          </label>
          <label class="slider-label">
            GIF 길이 (초)
            <input type="range" id="gifDuration" min="1" max="5" step="0.5" value="3" class="slider">
            <span class="slider-value" id="gifDurationValue">3초</span>
          </label>
        </div>

        <div class="control-group">
          <h3 class="group-title">💾 저장</h3>
          <button class="btn btn-success" id="downloadPng">PNG 저장</button>
          <button class="btn btn-success" id="downloadGif">GIF 저장</button>
          <button class="btn btn-danger" id="resetBtn">초기화</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>© 2024 Instant Polaroid Maker | Made with 💙</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <script src="./app.js"></script>
</body>
</html>
